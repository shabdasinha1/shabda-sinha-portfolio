<!doctype html>
<!--
  Served by Cloudflare Pages with a real 404 status for unknown URLs. Without
  this file, Pages would answer every unknown path with the homepage (status 200),
  which search engines treat as duplicate "soft 404" pages.
  Static and dependency-free; styles live in /404.css so the strict CSP
  (no inline styles or scripts) applies here too.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Shabda Kumar Sinha</title>
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/404.css" />
  </head>
  <body>
    <main>
      <p class="code">404</p>
      <h1>This page doesn’t exist.</h1>
      <p class="text">The link may be broken, or the page may have moved.</p>
      <a class="button" href="/">Back to the portfolio</a>
    </main>
  </body>
</html>
