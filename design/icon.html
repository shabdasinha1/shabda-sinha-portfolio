<!doctype html>
<!--
  Source for the app icons (favicon.ico, apple-touch-icon.png, icon-192/512.png,
  icon-maskable-512.png). Same monogram as the site logo: an italic serif "S" on ink.
  Query parameters: ?size=512&variant=rounded|square|maskable
  Regenerate: see README.md → "Regenerating brand images".
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Icon</title>
    <style>
      @font-face { font-family: 'Instrument Serif'; font-style: italic; src: url('../node_modules/@fontsource/instrument-serif/files/instrument-serif-latin-400-italic.woff2') format('woff2'); }
      * { margin: 0; box-sizing: border-box; }
      html, body { background: transparent; }
      .icon {
        display: grid; place-items: center;
        background: #131419;
        color: #e9b26a;
        font-family: 'Instrument Serif', serif;
        font-style: italic;
        line-height: 1;
      }
      /* Text sits slightly low in its line box; nudge it to the optical centre. */
      .icon span { transform: translate(-1%, 3%); }
    </style>
  </head>
  <body>
    <div class="icon" id="icon"><span>S</span></div>
    <script>
      const params = new URLSearchParams(location.search);
      const size = Number(params.get('size') || 512);
      const variant = params.get('variant') || 'rounded';
      const el = document.getElementById('icon');
      el.style.width = el.style.height = size + 'px';
      // rounded: browser tab/manifest "any"; square: iOS applies its own mask;
      // maskable: full bleed with the glyph inside the 80% safe zone.
      el.style.borderRadius = variant === 'rounded' ? size * 0.22 + 'px' : '0';
      el.style.fontSize = size * (variant === 'maskable' ? 0.52 : 0.7) + 'px';
    </script>
  </body>
</html>
