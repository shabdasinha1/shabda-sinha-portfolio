<!doctype html>
<!--
  Source for the 3D lanyard ID badge textures (src/assets/images/badge-front.jpg
  and badge-back.jpg), rendered at 640×900 (the card's 1.6:2.25 ratio) and 1.5×.
  ?side=front|back. The top ~12% stays clear for the lanyard clip slot.
  Regenerate: see README.md → "Regenerating brand images".
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Badge</title>
    <style>
      @font-face { font-family: 'Geist'; src: url('../node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
      @font-face { font-family: 'Geist Mono'; src: url('../node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2') format('woff2'); font-weight: 100 900; }
      * { margin: 0; box-sizing: border-box; }
      html, body { width: 640px; height: 900px; }
      body { position: relative; overflow: hidden; font-family: 'Geist', sans-serif; -webkit-font-smoothing: antialiased; }
      .side { position: absolute; inset: 0; display: none; }
      .side.on { display: block; }

      /* ---------- front ---------- */
      .front { background: #0a0a0c; color: #f5f5f7; }
      .front .glow { position: absolute; width: 760px; height: 760px; left: -200px; top: -380px; border-radius: 50%; background: radial-gradient(circle, rgb(41 151 255 / 0.45), transparent 62%); }
      .front .glow2 { position: absolute; width: 620px; height: 620px; right: -260px; bottom: -260px; border-radius: 50%; background: radial-gradient(circle, rgb(244 114 182 / 0.35), transparent 62%); }
      .front .grid { position: absolute; inset: 0; background-image: linear-gradient(to right, rgb(255 255 255 / 0.05) 1px, transparent 1px), linear-gradient(to bottom, rgb(255 255 255 / 0.05) 1px, transparent 1px); background-size: 40px 40px; }
      .front .top { position: absolute; top: 112px; left: 48px; right: 48px; display: flex; justify-content: space-between; align-items: center; font: 500 17px/1 'Geist Mono', monospace; letter-spacing: 0.16em; color: #a1a1a6; text-transform: uppercase; }
      .front .top b { color: #2997ff; font-weight: 500; }
      .photo { position: absolute; top: 160px; left: 48px; right: 48px; height: 400px; border-radius: 34px; overflow: hidden; border: 1px solid rgb(255 255 255 / 0.14); }
      .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; display: block; }
      .photo .chip { position: absolute; left: 18px; bottom: 18px; display: inline-flex; align-items: center; gap: 10px; padding: 10px 16px; border-radius: 999px; background: rgb(0 0 0 / 0.55); border: 1px solid rgb(255 255 255 / 0.18); font: 600 17px/1 'Geist', sans-serif; color: #fff; }
      .photo .dot { width: 11px; height: 11px; border-radius: 50%; background: #30d158; box-shadow: 0 0 0 5px rgb(48 209 88 / 0.25); }
      .name { position: absolute; top: 588px; left: 48px; right: 48px; font-size: 54px; line-height: 0.98; font-weight: 650; letter-spacing: -0.05em; }
      .role { position: absolute; top: 708px; left: 48px; right: 48px; font-size: 27px; font-weight: 600; letter-spacing: -0.03em; }
      .role span { background: linear-gradient(100deg, #2997ff, #a78bfa 52%, #f472b6); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .stack { position: absolute; top: 760px; left: 48px; right: 48px; font: 500 18px/1 'Geist Mono', monospace; color: #a1a1a6; letter-spacing: 0.02em; }
      .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: flex; align-items: center; justify-content: space-between; padding: 0 48px; background: linear-gradient(100deg, #0071e3, #7c3aed 52%, #db2777); font: 600 17px/1 'Geist Mono', monospace; letter-spacing: 0.14em; color: #fff; text-transform: uppercase; }
      .barcode { display: flex; gap: 3px; height: 26px; align-items: stretch; }
      .barcode i { display: block; background: rgb(255 255 255 / 0.85); }

      /* ---------- back ---------- */
      .back { background: linear-gradient(150deg, #0071e3 0%, #7c3aed 50%, #db2777 100%); color: #fff; }
      .back .noise { position: absolute; inset: 0; background-image: radial-gradient(rgb(255 255 255 / 0.12) 1px, transparent 1px); background-size: 6px 6px; opacity: 0.5; }
      .back .mono { position: absolute; top: 210px; left: 0; right: 0; text-align: center; font-size: 300px; line-height: 1; font-weight: 700; letter-spacing: -0.08em; color: rgb(255 255 255 / 0.95); }
      .back .tag { position: absolute; top: 560px; left: 0; right: 0; text-align: center; font-size: 40px; font-weight: 650; letter-spacing: -0.04em; }
      .back .sub { position: absolute; top: 620px; left: 0; right: 0; text-align: center; font: 500 19px/1.5 'Geist Mono', monospace; letter-spacing: 0.08em; color: rgb(255 255 255 / 0.85); text-transform: uppercase; }
      .back .url { position: absolute; left: 48px; right: 48px; bottom: 56px; text-align: center; padding: 16px; border-radius: 18px; background: rgb(0 0 0 / 0.25); border: 1px solid rgb(255 255 255 / 0.25); font: 500 19px/1.3 'Geist Mono', monospace; }
    </style>
  </head>
  <body>
    <section class="side front" id="front">
      <div class="glow"></div><div class="glow2"></div><div class="grid"></div>
      <div class="top"><span><b>Portfolio</b> · Dev ID</span><span>Indore · IN</span></div>
      <div class="photo">
        <img src="../src/assets/images/portrait.jpeg" alt="" />
        <span class="chip"><span class="dot"></span>Open to work</span>
      </div>
      <h1 class="name">Shabda Kumar<br />Sinha</h1>
      <p class="role"><span>MERN Stack Developer</span></p>
      <p class="stack">React.js · Node.js · Express.js · MongoDB</p>
      <div class="bar"><span>Immediate joiner</span><span class="barcode" id="barcode"></span></div>
    </section>

    <section class="side back" id="back">
      <div class="noise"></div>
      <div class="mono">S</div>
      <p class="tag">Full-stack, built to ship.</p>
      <p class="sub">2+ years · 8+ production apps<br />100+ REST APIs</p>
      <p class="url">shabdasinha1.github.io/shabda-sinha-portfolio</p>
    </section>

    <script>
      const side = new URLSearchParams(location.search).get('side') === 'back' ? 'back' : 'front';
      document.getElementById(side).classList.add('on');
      // Decorative barcode with a fixed pattern (deterministic renders).
      const widths = [3, 1, 2, 1, 4, 1, 1, 3, 2, 1, 3, 1, 2, 4, 1, 2, 1, 3, 1, 2];
      document.getElementById('barcode').innerHTML = widths.map((w) => `<i style="width:${w}px"></i>`).join('');
    </script>
  </body>
</html>
